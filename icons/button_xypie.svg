<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="geometricPrecision">
  <!-- 坐标轴 -->
  <line x1="0.5" y1="15.5" x2="0.5" y2="0.5" stroke="#000000" stroke-width="1"/>
  <line x1="0.5" y1="15.5" x2="15.5" y2="15.5" stroke="#000000" stroke-width="1"/>

  <!-- 1. 左上角：3根并排条形图 (宽度1.2，底部统一y=8.0) -->
  <rect x="1.5" y="5.0" width="1.2" height="3.0" fill="#b8ecc0" stroke="#000" stroke-width="0.2" rx="0.2"/>
  <rect x="3.3" y="3.5" width="1.2" height="4.5" fill="#ffaaaa" stroke="#000" stroke-width="0.2" rx="0.2"/>
  <rect x="5.1" y="6.0" width="1.2" height="2.0" fill="#006680" stroke="#000" stroke-width="0.2" rx="0.2"/>

  <!-- 2. 右上角小饼图 (中心 13.5,5.5, 半径 1.8，3等分120度) -->
  <path d="M 13.5,5.5 L 15.3,5.5 A 1.8,1.8 0 0,1 12.6,7.059 Z" fill="#b8ecc0" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <path d="M 13.5,5.5 L 12.6,7.059 A 1.8,1.8 0 0,1 12.6,3.941 Z" fill="#ffaaaa" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <path d="M 13.5,5.5 L 12.6,3.941 A 1.8,1.8 0 0,1 15.3,5.5 Z" fill="#006680" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>

  <!-- 3. 左下角：3段圆环图 (中心 4.5, 11.5, 外 3.0, 内 1.8，消除“断裂”视觉) -->
  <!-- 3. 左下角：3段分离圆环图（中心 4.5, 11.5, 外半径 2.8, 内半径 1.5，分离间隙防重叠） -->
  <!-- 绿色段 0°~118° -->
  <path d="M 7.3,11.5 A 2.8,2.8 0 0,1 3.19,13.97 L 3.80,12.82 A 1.5,1.5 0 0,0 6.0,11.5 Z" fill="#b8ecc0" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <!-- 红色段 122°~238° -->
  <path d="M 3.02,13.87 A 2.8,2.8 0 0,1 3.02,9.13 L 3.71,10.23 A 1.5,1.5 0 0,0 3.71,12.77 Z" fill="#ffaaaa" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <!-- 蓝色段 242°~360° -->
  <path d="M 3.19,9.03 A 2.8,2.8 0 0,1 7.3,11.5 L 6.0,11.5 A 1.5,1.5 0 0,0 3.80,10.18 Z" fill="#006680" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>

  <!-- 4. 右下角中饼图 (中心 12.5,11.5, 半径 2.5，3等分120度) -->
  <path d="M 12.5,11.5 L 15.0,11.5 A 2.5,2.5 0 0,1 11.25,13.665 Z" fill="#b8ecc0" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <path d="M 12.5,11.5 L 11.25,13.665 A 2.5,2.5 0 0,1 11.25,9.335 Z" fill="#ffaaaa" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
  <path d="M 12.5,11.5 L 11.25,9.335 A 2.5,2.5 0 0,1 15.0,11.5 Z" fill="#006680" stroke="#000" stroke-width="0.2" stroke-linejoin="round"/>
</svg>