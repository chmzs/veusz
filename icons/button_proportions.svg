<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ProportionalScatter toolbar icon - redesigned -->
<svg
   width="16"
   height="16"
   viewBox="0 0 16 16"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g id="layer1">
    <!-- Subtle background frame (optional, for visual boundary) -->
    <rect
       x="0.5" y="0.5" width="15" height="15"
       style="fill:none;stroke:#cccccc;stroke-width:0.5;stroke-linecap:round;stroke-linejoin:round" />

    <!-- Pie glyph (left) - 3 slices, modern palette -->
    <path
       style="fill:#4e79a7;fill-opacity:1;stroke:#ffffff;stroke-width:0.4;stroke-linecap:round;stroke-linejoin:round"
       d="M 3.5,5.5 A 3,3 0 0 1 6.5,2.5 L 3.5,5.5 Z" />
    <path
       style="fill:#e15759;fill-opacity:1;stroke:#ffffff;stroke-width:0.4;stroke-linecap:round;stroke-linejoin:round"
       d="M 3.5,5.5 A 3,3 0 0 1 6.5,8.5 L 3.5,5.5 Z" />
    <path
       style="fill:#59a14f;fill-opacity:1;stroke:#ffffff;stroke-width:0.4;stroke-linecap:round;stroke-linejoin:round"
       d="M 3.5,5.5 A 3,3 0 0 1 6.5,5.5 L 3.5,5.5 Z" />
    <!-- Center dot -->
    <circle
       cx="3.5" cy="5.5" r="0.7"
       style="fill:#ffffff;fill-opacity:0.9;stroke:none" />

    <!-- Donut glyph (center) - 2 rings, 3 segments each -->
    <path
       style="fill:#e15759;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round"
       d="M 8,9 A 2.2,2.2 0 0 1 10.2,6.8 L 8,9 Z" />
    <path
       style="fill:#4e79a7;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round"
       d="M 8,9 A 2.2,2.2 0 0 1 10.2,11.2 L 8,9 Z" />
    <path
       style="fill:#f28e2b;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round"
       d="M 8,5.8 A 2.2,2.2 0 0 1 10.2,9 L 8,5.8 Z" />
    <!-- Inner hole (white) -->
    <circle
       cx="8" cy="9" r="0.9"
       style="fill:#ffffff;fill-opacity:0.95;stroke:none" />

    <!-- Bar glyph (right) - 3 stacked bars -->
    <rect
       x="12" y="10.5" width="2" height="4.5"
       style="fill:#4e79a7;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round" />
    <rect
       x="12" y="6.5" width="2" height="3.5"
       style="fill:#f28e2b;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round" />
    <rect
       x="12" y="3.5" width="2" height="2.5"
       style="fill:#59a14f;fill-opacity:1;stroke:#ffffff;stroke-width:0.3;stroke-linecap:round;stroke-linejoin:round" />

    <!-- Subtle separator dots between glyph groups -->
    <circle cx="6.5" cy="8" r="0.3" style="fill:#cccccc;stroke:none" />
    <circle cx="11" cy="8" r="0.3" style="fill:#cccccc;stroke:none" />
  </g>
</svg>