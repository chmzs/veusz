name: Manual build binary on Windows (x86-64)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: 'windows-2022'

    steps:
    - uses: actions/checkout@v5
    - name: Setup build environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Make TMPDIR
      run: mkdir C:\vtmp
    - name: Modify TMPDIR in environment
      run: echo "TMPDIR=C:\vtmp" >> $env:GITHUB_ENV
    - name: Upgrade pip
      run : |
        python3 -m pip install --upgrade pip
    - name: Read version
      id: version
      run: |
        $ver = Get-Content VERSION
        echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        cache-key-prefix: 'qt-windows-binary-v1'
        version: '6.10.2'
        modules: 'qtimageformats'
        setup-python: false
    - name: Install Python dependencies (pre-compiled wheels)
      run: |
        pip3 -v install setuptools wheel packaging pyproject-metadata
        pip3 -v install PyQt6==6.11.0
        pip3 -v install numpy
        pip3 -v install pyinstaller
        pip3 -v install -r requirements.txt
        pip3 -v install iminuit
        pip3 -v install pytest
        pip3 -v install https://github.com/jeremysanders/pyemf3/archive/master.zip
    - name: Build Veusz extensions
      run: |
        python3 setup.py build_ext --inplace
        copy build\lib*\veusz\helpers\*.dll veusz\helpers
    - name: Run tests
      run: |
        set QT_QPA_PLATFORM=minimal
        set VEUSZ_INPLACE_TEST=1
        python tests/runselftest.py
      env:
        VEUSZ_INPLACE_TEST: '1'
        VEUSZ_REMOVE_FROM_ENV: 'QT_PLUGIN_PATH QML2_IMPORT_PATH'
    - name: Run feature unit tests
      run: |
        set QT_QPA_PLATFORM=offscreen
        python3 -m pytest tests/selftests/test_gradient_fill.py
      env:
        VEUSZ_REMOVE_FROM_ENV: 'QT_PLUGIN_PATH QML2_IMPORT_PATH'
    - name: Verify Qt/PyQt version match
      run: |
        python3 -c "
        from PyQt6.QtCore import qVersion, QT_VERSION_STR
        print(f'Qt runtime: {qVersion()}')
        print(f'Qt compile: {QT_VERSION_STR}')
        import numpy
        print(f'NumPy: {numpy.__version__}')
        assert qVersion() == QT_VERSION_STR, 'Qt version mismatch!'
        "
    - name: Build binary with pyinstaller
      run: |
        pyinstaller support/veusz_windows_pyinst.spec
    - name: Generate NSI file
      run: |
        python3 support/veusz_windows_make_nsi.py install.nsi
        mkdir installer_out
    - name: Use NSIS to make installer
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" install.nsi
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: installer_out
    - name: Package portable zip
      run: |
        $ver = "${{ steps.version.outputs.VERSION }}"
        powershell -Command "Compress-Archive -Path 'dist\\veusz_main' -DestinationPath 'veusz-${ver}-windows-x64.zip' -Force"
    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: veusz-${{ steps.version.outputs.VERSION }}-windows-x64
        path: veusz-${{ steps.version.outputs.VERSION }}-windows-x64.zip